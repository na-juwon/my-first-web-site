<!DOCTYPE html>
<html>
    <head>
        <title>web</title>
    </head>

    <body>
        <h1>login</h1>
        <p>username
            <input type="text" maxlength='8'>
        </p>
        <p>password
            <input type="text">
            </p>
        <input type ="submit" value="login">
        <h2>Creat Account</h2>
        <form action ="C:\Users\서주원\Desktop\practice\1.html" method ="get">
            <label for="username"></label>
        <p>username
            <input type="text" name="username" maxlength='8' >
            
        </p>
        <p>password
            <input type="password"
            placeholder="Password" 
            name="password" 
            id="password"
            pattern= "(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,16}"
            oninvalid="this.setCustomValidity('The password length must be 8 to 16 characters and must include at least one character, number, or special character, regardless of case.');"
            oninput="this.setCustomValidity(''); validatePassword();"
            required
        />
            <input type="password" 
            placeholder="Confirm Password" 
            id="confirm_password" 
            oninput="validatePassword();"
            required>
            <button type="submit" class="pure-button pure-button-primary">Confirm</button>
        </p>

        <script>
        function validatePassword() {
            var password = document.getElementById("password").value;
            var confirm_password = document.getElementById("confirm_password").value;
            if (password != confirm_password) {
                document.getElementById("confirm_password").setCustomValidity("Passwords do not match.");
            } else {
                document.getElementById("confirm_password").setCustomValidity("");
            }
        }
        </script>
        </p>
        <input type="submit" value="Creat Account">
        </form>
    </body>
</html>
